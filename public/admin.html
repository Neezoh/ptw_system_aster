<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin PTW</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .admin-shell { max-width: 1100px; margin: 0 auto; padding: 16px 0 40px; }
      .admin-card {
        background: rgba(18,28,43,0.96);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px 18px;
      }
      .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
      .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
      .form-group label { color: var(--muted); }
      .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
      }
      .form-group input[list] { background: var(--surface); }
      .form-hint { color: var(--muted); font-size: 0.78rem; }
      .record-manager { margin-top: 20px; }
      .record-manager-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
      .record-table-wrap { overflow-x: auto; }
      .record-table { width: 100%; min-width: 720px; border-collapse: collapse; }
      .record-table th, .record-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); text-align: left; }
      .record-table th { color: var(--muted); font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.06em; }
      .record-actions { display: flex; gap: 8px; }
      .record-actions button { min-height: 36px; padding: 0 12px; border-radius: 9px; font-weight: 700; }
      .edit-button { background: var(--blue-soft); color: #d9eeff; border: 1px solid rgba(76,155,214,0.4); }
      .delete-button { background: var(--danger-soft); color: #ffd8cf; border: 1px solid rgba(217,106,77,0.4); }
      .empty-records { color: var(--muted); padding: 16px 10px; }
      textarea { min-height: 120px; resize: vertical; }
      .inline-error { color: #ffb3b3; font-size: 0.8rem; }
      .toast {
        position: fixed; right: 20px; bottom: 20px; background: #123b2d; border: 1px solid rgba(48,179,106,0.5); color: #dffde9; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); display: none;
      }
      .toast.visible { display: block; }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">PTW</div>
          <div>
            <p class="eyebrow">ADMIN PANEL</p>
            <h1>Tambah / Edit PTW</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <div id="sessionBadge" class="session-badge guest">Guest Access</div>
          <a href="/dashboard" class="ghost-button">Dashboard</a>
          <a href="/" class="ghost-button">Back to Search</a>
        </div>
      </header>

      <main class="admin-card">
        <form id="ptwForm" novalidate>
          <div class="admin-grid">
            <div class="form-group">
              <label for="ptw_number">PTW Number</label>
              <input id="ptw_number" name="ptw_number" required />
              <span class="inline-error" data-error-for="ptw_number"></span>
            </div>
            <div class="form-group">
              <label for="jha_number">JHA Number</label>
              <input id="jha_number" name="jha_number" required />
              <span class="inline-error" data-error-for="jha_number"></span>
            </div>
            <div class="form-group">
              <label for="location">Location</label>
              <input id="location" name="location" list="locationOptions" autocomplete="off" required />
              <datalist id="locationOptions"></datalist>
              <span class="form-hint">Select an existing location or type a new one.</span>
              <span class="inline-error" data-error-for="location"></span>
            </div>
            <div class="form-group">
              <label for="permit_applicant_name">Permit Applicant Name</label>
              <input id="permit_applicant_name" name="permit_applicant_name" required />
              <span class="inline-error" data-error-for="permit_applicant_name"></span>
            </div>
            <div class="form-group">
              <label for="permit_type">Type of Permit</label>
              <select id="permit_type" name="permit_type">
                <option value="Cold">Cold</option>
                <option value="Hot">Hot</option>
              </select>
              <span class="inline-error" data-error-for="permit_type"></span>
            </div>
            <div class="form-group">
              <label for="work_leader">Work Leader</label>
              <input id="work_leader" name="work_leader" list="personnelOptions" autocomplete="off" required />
              <span class="inline-error" data-error-for="work_leader"></span>
            </div>
            <div class="form-group">
              <label for="authorised_authority">Authorised Authority</label>
              <input id="authorised_authority" name="authorised_authority" list="personnelOptions" autocomplete="off" required />
              <span class="inline-error" data-error-for="authorised_authority"></span>
            </div>
            <div class="form-group">
              <label for="authorised_authority_rep">Authorised Authority Rep</label>
              <input id="authorised_authority_rep" name="authorised_authority_rep" list="personnelOptions" autocomplete="off" />
              <span class="form-hint">Optional. Select an existing name or type a new one.</span>
              <span class="inline-error" data-error-for="authorised_authority_rep"></span>
            </div>
            <div class="form-group">
              <label for="date_issued">Date Issued</label>
              <input id="date_issued" name="date_issued" type="date" required />
              <span class="inline-error" data-error-for="date_issued"></span>
            </div>
            <div class="form-group">
              <label for="date_closed">Date Closed</label>
              <input id="date_closed" name="date_closed" type="date" />
              <span class="inline-error" data-error-for="date_closed"></span>
            </div>
            <div class="form-group">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
                <option value="Suspended">Suspended</option>
                <option value="Extended">Extended</option>
              </select>
              <span class="inline-error" data-error-for="status"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="work_description">Work Description</label>
            <textarea id="work_description" name="work_description" maxlength="2000"></textarea>
            <span class="inline-error" data-error-for="work_description"></span>
          </div>

          <div class="form-group">
            <label for="remark">Remark</label>
            <textarea id="remark" name="remark"></textarea>
            <span class="inline-error" data-error-for="remark"></span>
          </div>

          <div class="search-actions">
            <button class="primary-button" type="submit" id="saveButton">Save PTW</button>
            <button class="secondary-button" type="button" id="resetBtn">Reset</button>
          </div>
        </form>
      </main>

      <section class="admin-card record-manager">
        <div class="record-manager-header">
          <div>
            <p class="eyebrow">ADMIN CRUD</p>
            <h2>Existing PTW Records</h2>
          </div>
          <button class="secondary-button" type="button" id="refreshRecordsBtn">Refresh</button>
        </div>
        <div class="record-table-wrap">
          <table class="record-table">
            <thead>
              <tr><th>PTW Number</th><th>Location</th><th>Applicant</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="recordsBody"><tr><td class="empty-records" colspan="5">Loading records...</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>

    <datalist id="personnelOptions"></datalist>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
