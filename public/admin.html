<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin PTW</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      .admin-shell { max-width: 1100px; margin: 0 auto; padding: 16px 0 40px; }
      .admin-card {
        background: rgba(18,28,43,0.96);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 20px 18px;
      }
      .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
      .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
      .form-group label { color: var(--muted); }
      .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
      }
      textarea { min-height: 120px; resize: vertical; }
      .inline-error { color: #ffb3b3; font-size: 0.8rem; }
      .toast {
        position: fixed; right: 20px; bottom: 20px; background: #123b2d; border: 1px solid rgba(48,179,106,0.5); color: #dffde9; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); display: none;
      }
      .toast.visible { display: block; }
    </style>
  </head>
  <body>
    <div class="admin-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">PTW</div>
          <div>
            <p class="eyebrow">ADMIN PANEL</p>
            <h1>Tambah / Edit PTW</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <div id="sessionBadge" class="session-badge guest">Guest Access</div>
          <a href="/dashboard" class="ghost-button">Dashboard</a>
          <a href="/" class="ghost-button">Back to Search</a>
        </div>
      </header>

      <main class="admin-card">
        <form id="ptwForm" novalidate>
          <div class="admin-grid">
            <div class="form-group">
              <label for="ptw_number">PTW Number</label>
              <input id="ptw_number" name="ptw_number" required />
              <span class="inline-error" data-error-for="ptw_number"></span>
            </div>
            <div class="form-group">
              <label for="jha_number">JHA Number</label>
              <input id="jha_number" name="jha_number" required />
              <span class="inline-error" data-error-for="jha_number"></span>
            </div>
            <div class="form-group">
              <label for="location">Location</label>
              <select id="location" name="location"></select>
              <span class="inline-error" data-error-for="location"></span>
            </div>
            <div class="form-group">
              <label for="permit_applicant_name">Permit Applicant Name</label>
              <input id="permit_applicant_name" name="permit_applicant_name" required />
              <span class="inline-error" data-error-for="permit_applicant_name"></span>
            </div>
            <div class="form-group">
              <label for="permit_type">Type of Permit</label>
              <select id="permit_type" name="permit_type">
                <option value="Cold">Cold</option>
                <option value="Hot">Hot</option>
              </select>
              <span class="inline-error" data-error-for="permit_type"></span>
            </div>
            <div class="form-group">
              <label for="work_leader">Work Leader</label>
              <select id="work_leader" name="work_leader"></select>
              <span class="inline-error" data-error-for="work_leader"></span>
            </div>
            <div class="form-group">
              <label for="authorised_authority">Authorised Authority</label>
              <select id="authorised_authority" name="authorised_authority"></select>
              <span class="inline-error" data-error-for="authorised_authority"></span>
            </div>
            <div class="form-group">
              <label for="authorised_authority_rep">Authorised Authority Rep</label>
              <select id="authorised_authority_rep" name="authorised_authority_rep">
                <option value="">-- None --</option>
              </select>
              <span class="inline-error" data-error-for="authorised_authority_rep"></span>
            </div>
            <div class="form-group">
              <label for="date_issued">Date Issued</label>
              <input id="date_issued" name="date_issued" type="date" required />
              <span class="inline-error" data-error-for="date_issued"></span>
            </div>
            <div class="form-group">
              <label for="date_closed">Date Closed</label>
              <input id="date_closed" name="date_closed" type="date" />
              <span class="inline-error" data-error-for="date_closed"></span>
            </div>
            <div class="form-group">
              <label for="status">Status</label>
              <select id="status" name="status">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
                <option value="Suspended">Suspended</option>
                <option value="Extended">Extended</option>
              </select>
              <span class="inline-error" data-error-for="status"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="work_description">Work Description</label>
            <textarea id="work_description" name="work_description" maxlength="2000"></textarea>
            <span class="inline-error" data-error-for="work_description"></span>
          </div>

          <div class="form-group">
            <label for="remark">Remark</label>
            <textarea id="remark" name="remark"></textarea>
            <span class="inline-error" data-error-for="remark"></span>
          </div>

          <div class="search-actions">
            <button class="primary-button" type="submit">Save PTW</button>
            <button class="secondary-button" type="button" id="resetBtn">Reset</button>
          </div>
        </form>
      </main>
    </div>

    <div id="toast" class="toast" aria-live="polite"></div>

    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
