<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <style>
      body { display: grid; place-items: center; min-height: 100vh; }
      .login-shell { width: min(420px, calc(100vw - 24px)); }
      .login-card {
        background: rgba(18,28,43,0.96);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 24px 20px;
        box-shadow: var(--shadow);
      }
      .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
      .form-group label { color: var(--muted); }
      .form-group input {
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
      }
      .inline-error { color: #ffb3b3; min-height: 1rem; }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <p class="eyebrow accent">ADMIN</p>
        <h1>Login PTW</h1>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <div id="errorBox" class="inline-error" aria-live="polite"></div>
          <button class="primary-button" type="submit" style="width:100%;">Login</button>
        </form>
      </div>
    </div>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
