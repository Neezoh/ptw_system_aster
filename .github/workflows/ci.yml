name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ptw_system
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: ptw_system
      DB_USER: root
      DB_PASSWORD: root
      DB_SSL: false
      SESSION_SECRET: ci-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: change-me
      APP_URL: http://localhost:3000
      PORT: 3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import schema and seed
        run: |
          mysql -h 127.0.0.1 -uroot -proot ptw_system < database/schema.sql
          mysql -h 127.0.0.1 -uroot -proot ptw_system < database/seed.sql

      - name: Run tests
        run: npm test

      - name: Smoke test the health endpoint
        run: |
          node server.js > /tmp/ptw.log 2>&1 &
          sleep 5
          curl -f http://localhost:3000/api/health
          pkill -f "node server.js" || true
